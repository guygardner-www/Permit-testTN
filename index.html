.opt:active{transform:scale(.98)}.opt:disabled{cursor:default}

.opt.no{background:rgba(166,61,61,.1);border-color:rgba(166,61,61,.4);color:var(--no)}
.oc{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--ink-f);color:var(--ink-f);flex-shrink:0}
.opt.ok .oc{border-color:var(--ok);color:var(--ok)}.opt.no .oc{border-color:var(--no);color:var(--no)}
.btn{width:100%;padding:16px;font-size:16px;font-weight:700;font-family:'Playfair Display',Georgia,serif;background:var(--amber);color:#fff;border:none;border-radius:12px;cursor:pointer;box-shadow:0 2px 8px rgba(180,83,9,.2);transition:all .15s;-webkit-appearance:none}
.btn:active{transform:scale(.97)}.btn2{padding:14px;font-size:14px;font-weight:600;font-family:'Source Serif 4',Georgia,serif;background:var(--warm);color:var(--ink);border:1.5px solid rgba(0,0,0,.08);border-radius:10px;cursor:pointer;-webkit-appearance:none}
.pbar{height:5px;background:rgba(0,0,0,.06);border-radius:10px;overflow:hidden;margin-bottom:24px}.pfill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--amber),#f0c040);transition:width .4s}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.1),transparent);margin:20px 0}
.ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.cbar{height:6px;background:rgba(0,0,0,.06);border-radius:6px;overflow:hidden}.cfill{height:100%;border-radius:6px;transition:width .8s}

{id:4,cat:"signs",q:"La señal circular roja con franja blanca prohíbe:",s:"dne",a:"Estacionar en ambos lados de la calzada",b:"Ingresar a la vía en esa dirección",c:"El paso de vehículos comerciales pesados",d:"Realizar giros a la izquierda o en U",x:"b"},
{id:5,cat:"signs",q:"La señal circular amarilla con 'RR' y una 'X' advierte sobre:",s:"rr",a:"Una zona de descanso cercana a la derecha",b:"Un cruce de ferrocarril más adelante",c:"Trabajos de reparación en la carretera",d:"Una intersección principal en 500 pies",x:"b"},
{id:6,cat:"signs",q:"Una luz roja intermitente tiene el mismo efecto legal que:",s:"flashred",a:"Una luz amarilla de precaución general",b:"Una señal de ceda el paso (YIELD)",c:"Una señal de alto — detenerse por completo",d:"Un semáforo descompuesto sin regulación",x:"c"},
{id:7,cat:"signs",q:"Una luz amarilla intermitente indica al conductor que debe:",s:"flashyellow",a:"Detenerse por completo antes de proceder",b:"Proceder con precaución y velocidad reducida",c:"Prepararse para detenerse ante el cambio a rojo",d:"Ceder el paso al tráfico de la derecha",x:"b"},
{id:8,cat:"signs",q:"Al ver una luz amarilla fija del semáforo, el conductor debe:",s:"yellowlight",a:"Acelerar para cruzar antes del cambio a rojo",b:"Detenerse si puede hacerlo de manera segura",c:"Ceder el paso al tráfico de la vía transversal",d:"Completar su giro a la izquierda de inmediato",x:"b"},
{id:9,cat:"signs",q:"La luz verde del semáforo autoriza al conductor a:",s:"greenlight",a:"Avanzar sin necesidad de verificar la intersección",b:"Proceder cediendo paso a peatones y vehículos ya presentes",c:"Realizar exclusivamente giros a la derecha",d:"Acelerar rápidamente para despejar la intersección",x:"b"},
{id:10,cat:"signs",q:"Con luz roja fija, el conductor está obligado a:",s:"redlight",a:"Detenerse solo cuando hay peatones cruzando",b:"Detenerse detrás del cruce peatonal o línea de alto",c:"Reducir la velocidad y ceder el paso al tráfico",d:"Detenerse solo al aproximarse vehículos por la transversal",x:"b"},
{id:11,cat:"signs",q:"La señal de cruceta (crossbuck) en un cruce de ferrocarril exige:",s:"crossbuck",a:"Ceder el paso al tráfico vehicular por la izquierda",b:"Mirar en ambas direcciones y ceder paso a los trenes",c:"Acelerar para cruzar las vías antes de un tren",d:"Detenerse solo al escuchar la bocina del tren",x:"b"},
{id:12,cat:"signs",q:"Las señales de color naranja en forma de diamante indican:",s:"const1",a:"Zonas escolares con cruces peatonales frecuentes",b:"Áreas de interés recreativo y parques estatales",c:"Zonas de construcción y mantenimiento vial",d:"Servicios para el automovilista como gasolina",x:"c"},
{id:13,cat:"signs",q:"La señal con fondo amarillo-verde fluorescente indica:",s:"school",a:"Una zona de construcción nocturna adelante",b:"Un área de descanso con servicios sanitarios",c:"Una zona escolar con posible presencia de niños",d:"Una ruta de evacuación de emergencia cercana",x:"c"},
{id:14,cat:"signs",q:"El color amarillo en señales de tránsito se usa para:",s:"warn",a:"Señales de alto y prohibición en intersecciones",b:"Señales de guía hacia destinos y salidas",c:"Señales de advertencia sobre condiciones viales",d:"Señales de servicios para el automovilista",x:"c"},
{id:15,cat:"signs",q:"Las señales reglamentarias generalmente tienen fondo:",a:"Amarillo con símbolos y letras negras",b:"Blanco con letras negras o rojas",c:"Verde con letras y flechas blancas",d:"Naranja con símbolos y letras negras",x:"b"},
{id:16,cat:"signs",q:"Esta señal amarilla con flecha curva advierte sobre:",s:"curve",a:"Un giro obligatorio a la izquierda inmediato",b:"Una curva pronunciada con velocidad reducida",c:"La terminación del carril izquierdo adelante",d:"Un desvío obligatorio por construcción cercana",x:"b"},
{id:17,cat:"signs",q:"Esta señal amarilla de advertencia indica que:",s:"merge",a:"Tráfico de otra vía se incorporará al flujo",b:"La carretera se dividirá en dos vías separadas",c:"El puente adelante es más estrecho que la vía",d:"Se aproxima una zona con pendiente pronunciada",x:"a"},
{id:18,cat:"signs",q:"La señal con silueta de persona caminando indica:",s:"ped",a:"Proximidad a una zona escolar con semáforo",b:"Un cruce de peatones adelante en la vía",c:"Una zona autorizada para hacer autoestop",d:"Un sendero peatonal junto al área de descanso",x:"b"},
{id:19,cat:"signs",q:"La señal 'DO NOT PASS' indica que en esta zona:",s:"dnp",a:"Rige un límite de velocidad especial reducido",b:"No se permite adelantar a otros vehículos",c:"Está prohibido el estacionamiento en el arcén",d:"La circulación es en un solo sentido de marcha",x:"b"},
{id:20,cat:"signs",q:"La señal 'ONE WAY' indica que:",s:"oneway",a:"La entrada a esta vía está prohibida",b:"La carretera está temporalmente cerrada al tráfico",c:"Todo el tráfico circula en una sola dirección",d:"Los carriles se fusionan más adelante en la vía",x:"c"},
{id:21,cat:"signs",q:"Una flecha verde en el semáforo indica que:",s:"garrow",a:"El conductor debe ceder paso antes de girar",b:"El giro está protegido y puede proceder",c:"Debe esperar hasta que aparezca el verde circular",d:"Solo los peatones pueden cruzar en esa dirección",x:"b"},
{id:22,cat:"signs",q:"Las señales con fondo azul informan sobre:",s:"service",a:"Regulaciones de tránsito y leyes estatales",b:"Advertencias de peligro y curvas en la vía",c:"Servicios como gasolina, alimentos y hospitales",d:"Zonas de construcción y mantenimiento activo",x:"c"},
{id:23,cat:"signs",q:"Las señales con fondo marrón indican:",s:"brown",a:"Límites de velocidad para zonas rurales",b:"Puntos de interés recreativo y cultural",c:"Zonas hospitalarias y centros de atención",d:"Zonas escolares y cruces de peatones",x:"b"},
{id:24,cat:"signs",q:"Las señales con fondo verde proporcionan:",s:"guide",a:"Información sobre zonas de trabajo activas",b:"Advertencias sobre condiciones climáticas adversas",c:"Guía de destinos, distancias y salidas",d:"Regulaciones de estacionamiento y horarios",x:"c"},
{id:25,cat:"signs",q:"Cuando los semáforos no funcionan, los conductores deben:",a:"Atravesar la intersección a velocidad reducida",b:"Tratar la intersección como parada total",c:"Ceder el paso solo si observan otro tráfico",d:"Estacionarse y esperar a que se restablezcan",x:"b"},
{id:26,cat:"signs",q:"Dos líneas amarillas continuas en el centro indican:",s:"dblyellow",a:"Que se permite adelantar con visibilidad suficiente",b:"Que está prohibido cruzarlas en cualquier dirección",c:"Que el carril derecho terminará próximamente",d:"Que se trata de un carril de uso compartido",x:"b"},
{id:27,cat:"signs",q:"Una línea amarilla continua junto a una discontinua — los conductores del lado discontinuo:",s:"yline",a:"Tienen prohibido adelantar bajo cualquier circunstancia",b:"Pueden adelantar cuando las condiciones sean seguras",c:"Deben cambiar al carril de sentido contrario inmediatamente",d:"Están circulando dentro de una zona de construcción",x:"b"},
{id:28,cat:"signs",q:"Las líneas blancas discontinuas entre carriles del mismo sentido indican que:",s:"wline",a:"Está prohibido cambiar de carril en esta zona",b:"Se permite cambiar de carril cuando sea seguro",c:"El carril está reservado para vehículos de alta ocupación",d:"Se trata de un carril exclusivo para emergencias",x:"b"},
{id:29,cat:"signs",q:"La velocidad máxima en interestatales de Tennessee es:",a:"55 mph",b:"65 mph",c:"70 mph",d:"75 mph",x:"c"},
{id:30,cat:"signs",q:"El límite predeterminado en carreteras estatales de TN es:",a:"45 mph",b:"50 mph",c:"55 mph",d:"65 mph",x:"c"},
{id:31,cat:"signs",q:"En zonas urbanas congestionadas de interestatales, el límite suele ser:",a:"45 mph",b:"55 mph",c:"65 mph",d:"70 mph",x:"b"},
{id:32,cat:"signs",q:"El emblema triangular anaranjado/rojo en un vehículo indica:",s:"slow",a:"Transporte de materiales peligrosos o inflamables",b:"Vehículo que circula a 25 mph o menos",c:"Vehículo realizando una parada de emergencia",d:"Vehículo oficial de mantenimiento de carreteras",x:"b"},
{id:33,cat:"signs",q:"¿Se permite girar a la derecha con luz roja en Tennessee?",a:"No, está prohibido bajo cualquier circunstancia",b:"Sí, tras detenerse completamente, salvo señal contraria",c:"Solo cuando hay una flecha verde de giro activa",d:"Solo durante el horario diurno de 6 AM a 9 PM",x:"b"},
{id:34,cat:"signs",q:"Si un agente de tránsito contradice el semáforo, el conductor debe:",a:"Seguir las indicaciones del semáforo",b:"Obedecer al agente de tránsito",c:"Esperar a que se resuelva la contradicción",d:"Detenerse y estacionar hasta recibir instrucciones",x:"b"},
{id:35,cat:"signs",q:"La multa mínima por exceso de velocidad en zonas de trabajo activas en TN es:",a:"$50 con máxima de $200 por primera infracción",b:"$100 con máxima de $300 según la velocidad",c:"$250 con máxima de $500 según las circunstancias",d:"$500 con posible suspensión de la licencia",x:"c"},
// CONDUCCIÓN SEGURA
{id:101,cat:"safety",q:"La regla de los dos segundos se utiliza para:",a:"Calcular la duración de los ciclos del semáforo",b:"Mantener una distancia de seguimiento segura",c:"Determinar el momento adecuado para cambiar de carril",d:"Establecer el tiempo permitido en una señal de alto",x:"b"},
{id:102,cat:"safety",q:"Según la ley de Tennessee, es ilegal mientras se conduce:",a:"Utilizar un dispositivo de manos libres para llamadas",b:"Sostener un teléfono celular con cualquier parte del cuerpo",c:"Utilizar un sistema de navegación GPS integrado",d:"Escuchar música o podcasts mediante los altavoces",x:"b"},
{id:103,cat:"safety",q:"Las luces delanteras deben encenderse desde:",a:"El momento en que oscurece completamente",b:"30 minutos después del atardecer y con visibilidad reducida",c:"Solo durante condiciones de lluvia o niebla",d:"Exclusivamente al circular por carreteras interestatales",x:"b"},
{id:104,cat:"safety",q:"Las luces altas deben atenuarse cuando un vehículo se aproxima a menos de:",a:"200 pies de distancia del vehículo propio",b:"500 pies de distancia del vehículo propio",c:"1,000 pies de distancia del vehículo propio",d:"Un cuarto de milla del vehículo propio",x:"b"},
{id:105,cat:"safety",q:"Enviar un texto a 55 mph equivale a conducir a ciegas por:",a:"Aproximadamente la mitad de un campo de fútbol",b:"Aproximadamente la longitud de un campo de fútbol",c:"Aproximadamente la longitud de dos autobuses escolares",d:"Aproximadamente 500 pies de carretera despejada",x:"b"},
{id:106,cat:"safety",q:"Al estacionar cuesta abajo CON bordillo, girar las ruedas:",a:"En dirección recta y paralela al bordillo",b:"Alejándolas del bordillo, hacia la izquierda",c:"Hacia el bordillo, para detenerse contra él",d:"En cualquier dirección si usa freno de mano",x:"c"},
{id:107,cat:"safety",q:"Al estacionar cuesta arriba CON bordillo, girar las ruedas:",a:"Hacia el bordillo para que se detenga ahí",b:"Alejándolas del bordillo, hacia la izquierda",c:"En dirección recta para facilitar la salida",d:"En cualquier dirección si usa freno de mano",x:"b"},
{id:108,cat:"safety",q:"La ley de Tennessee exige cinturón de seguridad para:",a:"Todos los ocupantes del vehículo sin excepción",b:"Ocupantes del asiento delantero y menores de 18",c:"Solo los menores de 16 años en cualquier asiento",d:"Solo el conductor y el copiloto del vehículo",x:"b"},
{id:109,cat:"safety",q:"Al adelantar a un ciclista, la separación lateral mínima es:",a:"1 pie entre el vehículo y la bicicleta",b:"3 pies entre el vehículo y la bicicleta",c:"6 pies entre el vehículo y la bicicleta",d:"El ancho de un carril completo de la vía",x:"b"},
{id:110,cat:"safety",q:"Con un autobús escolar con luces rojas activadas en vía no dividida:",a:"Reducir a 15 mph y proceder con extrema precaución",b:"Detenerse hasta que las luces paren y el brazo se retraiga",c:"Adelantar por el carril izquierdo a velocidad reducida",d:"Detenerse únicamente si hay niños visibles en la zona",x:"b"},
{id:111,cat:"safety",q:"El punto ciego del vehículo se encuentra:",a:"Directamente frente al capó del vehículo",b:"A los lados y ligeramente detrás del vehículo",c:"Exclusivamente en la zona posterior del vehículo",d:"En el área del tablero que bloquea la vista",x:"b"},
{id:112,cat:"safety",q:"Antes de cambiar de carril, el conductor debe:",a:"Acelerar y moverse rápidamente al carril deseado",b:"Verificar espejos, señalizar y revisar el punto ciego",c:"Verificar únicamente el espejo retrovisor central",d:"Activar la bocina para alertar a otros conductores",x:"b"},
{id:113,cat:"safety",q:"La ley 'Move Over' de Tennessee exige que los conductores:",a:"Cambien de carril al salir de cualquier autopista",b:"Se muevan un carril o reduzcan velocidad ante emergencias detenidas",c:"Cedan el paso a todo tráfico que intente incorporarse",d:"Circulen siempre por el carril derecho en autopistas",x:"b"},
{id:114,cat:"safety",q:"Si pierde su salida en la interestatal, debe:",a:"Detenerse en el arcén y retroceder hasta la salida",b:"Cruzar la mediana para tomar la salida correcta",c:"Continuar hasta la siguiente salida disponible",d:"Realizar un giro en U en la próxima abertura",x:"c"},
{id:115,cat:"safety",q:"Si el vehículo comienza a hidroplanear, el conductor debe:",a:"Pisar firmemente el pedal de freno de inmediato",b:"Retirar el pie del acelerador y mantener el volante recto",c:"Girar el volante bruscamente hacia el arcén derecho",d:"Acelerar para que las ruedas superen la capa de agua",x:"b"},
{id:116,cat:"safety",q:"En niebla densa, el conductor debe utilizar:",a:"Las luces altas para iluminar la mayor distancia posible",b:"Solo las luces de estacionamiento para no encandilar",c:"Las luces bajas y antiniebla si están disponibles",d:"Ninguna iluminación para evitar reflejos en la niebla",x:"c"},
{id:117,cat:"safety",q:"Si los frenos del vehículo fallan, el conductor debe:",a:"Apagar el motor de inmediato para cortar la inercia",b:"Bombear el pedal, reducir marcha y usar freno de mano",c:"Girar el volante de lado a lado para crear fricción",d:"Abrir la puerta del conductor para frenar con el pie",x:"b"},
{id:118,cat:"safety",q:"Es ilegal seguir a un camión de bomberos en servicio a menos de:",a:"100 pies del vehículo de emergencia en cuestión",b:"300 pies del vehículo de emergencia en cuestión",c:"500 pies del vehículo de emergencia en cuestión",d:"1,000 pies del vehículo de emergencia en cuestión",x:"c"},
{id:119,cat:"safety",q:"Conducir solo con luces de estacionamiento encendidas es:",a:"Permitido en zonas urbanas bien iluminadas",b:"Inseguro e ilegal en el estado de Tennessee",c:"Aceptable solo durante las primeras horas del alba",d:"Requerido al circular a velocidad muy reducida",x:"b"},
{id:120,cat:"safety",q:"La causa principal de choques en Tennessee es:",a:"Las fallas mecánicas en el sistema de frenos",b:"Las condiciones climáticas adversas e impredecibles",c:"La conducción distraída por uso de dispositivos",d:"El mal estado de la superficie de las carreteras",x:"c"},
// REGLAS
{id:201,cat:"rules",q:"En una parada de todos los sentidos, el derecho de paso es para:",a:"El vehículo que se aproxima desde la izquierda",b:"El que llegó primero; si llegan a la vez, el de la derecha",c:"El vehículo de mayor tamaño o peso bruto",d:"El vehículo que planea realizar un giro a la derecha",x:"b"},
{id:202,cat:"rules",q:"Al girar a la izquierda con luz verde, el conductor debe:",a:"Proceder de inmediato porque tiene la luz a su favor",b:"Ceder paso al tráfico de frente y a los peatones",c:"Ceder paso solo al tráfico de la vía transversal",d:"Completar el giro rápidamente antes del cambio de luz",x:"b"},
{id:203,cat:"rules",q:"En una intersección en 'T', debe ceder el paso:",a:"El conductor de la carretera principal en ambas direcciones",b:"El conductor de la calle que termina en la intersección",c:"Ambos conductores deben detenerse y alternar turnos",d:"El conductor que realizará el giro a la izquierda",x:"b"},
{id:204,cat:"rules",q:"Es ilegal estacionar a menos de 15 pies de:",a:"Cualquier intersección controlada por semáforos",b:"Una boca de incendios o hidrante contra incendios",c:"La entrada de cualquier estacionamiento comercial",d:"Un cruce peatonal en zona residencial o urbana",x:"b"},
{id:205,cat:"rules",q:"Es ilegal estacionar a menos de 20 pies de:",a:"Cualquier señal de alto o dispositivo de control",b:"Un cruce de peatones o área marcada para cruce",c:"La entrada de cualquier camino o propiedad privada",d:"Una parada de autobús sin señalización específica",x:"b"},
{id:206,cat:"rules",q:"Es ilegal estacionar a menos de 50 pies de:",a:"Un semáforo en cualquier intersección principal",b:"Un cruce de ferrocarril o paso a nivel ferroviario",c:"Una zona escolar durante las horas de clases",d:"La entrada principal de cualquier hospital público",x:"b"},
{id:207,cat:"rules",q:"Un giro en U es ilegal cuando se realiza en:",s:"nout",a:"Cualquier intersección que tenga semáforo activo",b:"Curvas, colinas o donde la visibilidad sea menor de 500 pies",c:"Calles de un solo sentido de circulación vehicular",d:"Intersecciones que tengan señales de alto instaladas",x:"b"},
{id:208,cat:"rules",q:"Al incorporarse desde una entrada privada, el conductor debe:",a:"Tocar la bocina para alertar al tráfico de la vía",b:"Ceder paso a todo el tráfico y peatones de la vía",c:"Proceder si la carretera está libre por 500 pies",d:"Hacer señales con las luces delanteras del vehículo",x:"b"},
{id:209,cat:"rules",q:"Es legal adelantar por la derecha cuando:",a:"La carretera tiene suficiente espacio para dos vehículos",b:"El vehículo de adelante está girando a la izquierda",c:"Se circula por cualquier carretera interestatal",d:"Nunca, ya que siempre es ilegal en Tennessee",x:"b"},
{id:210,cat:"rules",q:"Con las barreras del ferrocarril abajo y luces parpadeando:",a:"Rodear las barreras si no se observa ningún tren",b:"Detenerse y esperar hasta que suban y las luces paren",c:"Tocar la bocina y proceder si parece ser seguro",d:"Dar marcha atrás y buscar una ruta alternativa",x:"b"},
{id:211,cat:"rules",q:"Arrojar basura en carreteras de TN resulta en multas de:",a:"$10 a $25 dependiendo de la cantidad de desechos",b:"$50 a $3,000 más servicio comunitario obligatorio",c:"$100 a $200 como sanción administrativa estándar",d:"$25 a $100 por infracción para primera vez",x:"b"},
{id:212,cat:"rules",q:"Ante un cortejo fúnebre, los conductores están obligados a:",a:"Ceder el paso solo cuando un agente lo indique",b:"No cortar ni introducirse entre los vehículos",c:"Ceder el paso solamente en las intersecciones",d:"Continuar su circulación sin alteraciones de velocidad",x:"b"},
{id:213,cat:"rules",q:"La Regla Básica de Velocidad (BSR) establece que la velocidad debe ser:",a:"Igual al límite publicado en todas las condiciones",b:"Razonable y prudente según las condiciones existentes",c:"Siempre 5 mph menor al límite de velocidad publicado",d:"Determinada por el flujo general del tráfico circundante",x:"b"},
{id:214,cat:"rules",q:"¿Se puede exceder el límite de velocidad para adelantar en Tennessee?",a:"Sí, se permite exceder hasta 10 mph durante la maniobra",b:"No, está prohibido exceder el límite bajo cualquier circunstancia",c:"Sí, pero solo en carreteras rurales de dos carriles",d:"Sí, si el vehículo adelante circula a velocidad muy reducida",x:"b"},
{id:215,cat:"rules",q:"Al incorporarse a la interestatal desde una rampa de acceso:",a:"El vehículo que se incorpora tiene el derecho de paso",b:"Los vehículos en la autopista tienen prioridad de paso",c:"El vehículo que circule a mayor velocidad tiene prioridad",d:"El vehículo que se encuentre a la derecha tiene prioridad",x:"b"},
{id:216,cat:"rules",q:"En una carretera de múltiples carriles, el conductor debe:",a:"Circular normalmente por el carril más a la izquierda",b:"Usar el carril derecho y el izquierdo solo para adelantar",c:"Utilizar el carril central para mayor seguridad general",d:"Alternar entre los carriles para evitar fatiga al conducir",x:"b"},
// ALCOHOL
{id:301,cat:"alcohol",q:"El nivel de CAS que constituye intoxicación legal para conductores de 21+ en TN es:",s:"bac",a:"0.05% de concentración de alcohol en la sangre",b:"0.08% de concentración de alcohol en la sangre",c:"0.10% de concentración de alcohol en la sangre",d:"0.12% de concentración de alcohol en la sangre",x:"b"},
{id:302,cat:"alcohol",q:"Para menores de 21 en Tennessee, el límite de CAS es:",a:"0.02% — cualquier nivel superior resulta en sanciones",b:"0.04% según lo establecido por la legislación federal",c:"0.08% — el mismo límite que para conductores adultos",d:"0.00% — tolerancia cero ante cualquier cantidad detectable",x:"a"},
{id:303,cat:"alcohol",q:"La Ley de Consentimiento Implícito establece que:",s:"consent",a:"El conductor puede rechazar pruebas sin consecuencia",b:"Al conducir en TN, se consiente a pruebas químicas",c:"Debe consentir a una inspección completa del vehículo",d:"Las autoridades pueden registrar sin causa probable",x:"b"},
{id:304,cat:"alcohol",q:"Si se niega a la prueba química requerida legalmente:",a:"No hay ninguna consecuencia legal por la negativa",b:"La licencia se suspende por doce (12) meses",c:"Solo recibirá una amonestación verbal registrada",d:"Sus tarifas de seguro vehicular se incrementarán",x:"b"},
{id:305,cat:"alcohol",q:"Lo único que restaura la sobriedad de una persona es:",a:"El consumo de café concentrado o bebidas con cafeína",b:"Una ducha fría o la exposición prolongada al aire fresco",c:"La realización de ejercicio físico de alta intensidad",d:"El tiempo — el hígado procesa una bebida por hora",x:"d"},
{id:306,cat:"alcohol",q:"12 oz cerveza, 5 oz vino y 1.5 oz licor (80 proof) contienen:",a:"La misma cantidad aproximada de alcohol puro",b:"Cantidades diferentes, la cerveza tiene mucho menos",c:"Cantidades diferentes, el vino tiene significativamente más",d:"Cantidades diferentes según la marca y el fabricante",x:"a"},
{id:307,cat:"alcohol",q:"El alcohol afecta primero la capacidad del conductor en:",a:"La agudeza auditiva y percepción de sonidos del tráfico",b:"El juicio, la toma de decisiones y el razonamiento",c:"La fuerza física para girar el volante y frenar",d:"El sentido del equilibrio y la orientación espacial",x:"b"},
{id:308,cat:"alcohol",q:"Con un CAS de 0.10%, el riesgo de accidente aumenta:",a:"Aproximadamente 2 veces la probabilidad normal",b:"Aproximadamente 4 veces la probabilidad normal",c:"Aproximadamente 7 veces la probabilidad normal",d:"Aproximadamente 15 veces la probabilidad normal",x:"c"},
{id:309,cat:"alcohol",q:"Con un CAS de 0.15%, el riesgo de accidente aumenta:",a:"Aproximadamente 5 veces la probabilidad normal",b:"Aproximadamente 10 veces la probabilidad normal",c:"Aproximadamente 25 veces la probabilidad normal",d:"Aproximadamente 50 veces la probabilidad normal",x:"c"},

const CAT={signs:"Señales y Semáforos",safety:"Conducción Segura",rules:"Reglas de Tránsito",alcohol:"Drogas y Alcohol"};
const CC={signs:"#b45309",safety:"#1d6fa5",rules:"#2d724f",alcohol:"#7c3aad"};
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}

let state={screen:"home",qs:[],cur:0,ans:{},sel:null,fb:false,done:false,review:false,stats:{n:0,p:0,best:0}};

function startTest(){
  let by={signs:[],safety:[],rules:[],alcohol:[]};
  ALL.forEach(q=>by[q.cat].push(q));
  let picked=[];
  Object.values(by).forEach(c=>picked.push(...shuffle(c).slice(0,8)));
  while(picked.length<30){let r=ALL.filter(q=>!picked.includes(q));if(!r.length)break;picked.push(shuffle(r)[0])}
  state={...state,screen:"test",qs:shuffle(picked).slice(0,30),cur:0,ans:{},sel:null,fb:false,done:false,review:false};
  render();
}
function pickAnswer(c){if(state.fb)return;state.sel=c;state.fb=true;state.ans[state.cur]=c;render()}
function nextQ(){state.sel=null;state.fb=false;if(state.cur<29){state.cur++;render();return}let sc=state.qs.filter((q,i)=>state.ans[i]===q.x).length;state.stats.n++;if(sc>=24)state.stats.p++;state.stats.best=Math.max(state.stats.best,sc);state.done=true;render()}
function render(){let app=document.getElementById('app');if(state.screen==="home"){renderHome(app);return}if(state.done&&!state.review){renderResults(app);return}if(state.review){renderReview(app);return}renderTest(app)}

function renderHome(el){let s=state.stats;el.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center"><div style="margin-bottom:8px;color:var(--amber);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase">Estado de Tennessee</div><h1 class="display" style="font-size:38px;margin:0 0 4px">Examen de Práctica</h1><p style="font-size:16px;color:var(--ink-lt);margin:0 0 32px;font-style:italic">Permiso de Conducir</p><div class="card" style="margin-bottom:24px"><p style="font-size:15px;color:var(--ink-lt);line-height:1.7;margin:0 0 20px"><strong style="color:var(--amber)">30 preguntas aleatorias</strong> de un banco de más de 100 — un examen nuevo cada vez.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px">${Object.entries(CAT).map(([k,v])=>`<div style="padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.02);border-left:3px solid ${CC[k]};text-align:left"><div style="font-size:11px;font-weight:700;color:${CC[k]}">25%</div><div style="font-size:12px;color:var(--ink-lt);margin-top:2px">${v}</div></div>`).join('')}</div><div class="divider"></div><div style="display:flex;justify-content:center;gap:40px;margin-bottom:20px"><div style="text-align:center"><div class="display" style="font-size:28px;color:var(--ok)">24</div><div style="font-size:12px;color:var(--ink-f)">para aprobar</div></div><div style="text-align:center"><div class="display" style="font-size:28px;color:var(--no)">7+</div><div style="font-size:12px;color:var(--ink-f)">errores = reprobar</div></div></div>${s.n>0?`<div class="divider"></div><div style="display:flex;justify-content:center;gap:24px;font-size:13px;color:var(--ink-lt)"><span>Exámenes: <strong>${s.n}</strong></span><span>Aprobados: <strong style="color:var(--ok)">${s.p}</strong></span><span>Mejor: <strong style="color:var(--amber)">${s.best}/30</strong></span></div>`:''}</div><button class="btn" onclick="startTest()">Comenzar Examen</button><p style="margin-top:16px;font-size:11px;color:var(--ink-f)">Basado en el Manual de Licencia de Conducir de Tennessee — Secciones B y C</p></div>`}

function renderTest(el){let q=state.qs[state.cur];if(!q)return;let prog=((state.cur+(state.fb?1:0))/30)*100;let cS=Object.entries(state.ans).filter(([i,a])=>state.qs[i]&&a===state.qs[i].x).length;let wS=Object.keys(state.ans).length-cS;let sign=q.s&&SVG[q.s]?`<div class="sign-box">${SVG[q.s]}</div>`:'';el.innerHTML=`<div class="fade"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="display" style="font-size:15px">${state.cur+1}<span style="color:var(--ink-f);font-weight:400"> / 30</span></span><span class="pill" style="background:${CC[q.cat]}">${CAT[q.cat]}</span></div><div class="pbar"><div class="pfill" style="width:${prog}%"></div></div><div class="card" style="margin-bottom:16px">${sign}<p style="font-size:16px;font-weight:600;line-height:1.55">${esc(q.q)}</p></div>${['a','b','c','d'].map(o=>{if(!q[o])return'';let cls='opt';if(state.fb&&q.x===o)cls+=' ok';if(state.fb&&state.sel===o&&q.x!==o)cls+=' no';if(!state.fb&&state.sel===o)cls+=' sel';let ci=state.fb&&q.x===o?'✓':state.fb&&state.sel===o&&q.x!==o?'✗':o.toUpperCase();return`<button class="${cls}" onclick="pickAnswer('${o}')" ${state.fb?'disabled':''}><span class="oc">${ci}</span><span>${esc(q[o])}</span></button>`}).join('')}${state.fb?`<button class="btn" onclick="nextQ()" style="margin-top:4px">${state.cur===29?'Ver Resultados':'Siguiente Pregunta →'}</button>`:''}<div style="display:flex;justify-content:center;gap:24px;margin-top:16px;font-size:12px;color:var(--ink-f)"><span>✓ <strong style="color:var(--ok)">${cS}</strong></span><span>✗ <strong style="color:var(--no)">${wS}</strong></span><span>◯ <strong style="color:var(--amber)">${30-Object.keys(state.ans).length}</strong></span></div></div>`}

function renderResults(el){let score=state.qs.filter((q,i)=>state.ans[i]===q.x).length;let passed=score>=24;let pct=Math.round((score/30)*100);let cs={};state.qs.forEach((q,i)=>{if(!cs[q.cat])cs[q.cat]={t:0,c:0};cs[q.cat].t++;if(state.ans[i]===q.x)cs[q.cat].c++});el.innerHTML=`<div class="fade" style="padding-top:40px;text-align:center"><div class="ring" style="border:4px solid ${passed?'var(--ok)':'var(--no)'};background:${passed?'rgba(61,122,79,.06)':'rgba(166,61,61,.06)'}"><div><div class="display" style="font-size:42px;color:${passed?'var(--ok)':'var(--no)'}">${score}</div><div style="font-size:13px;color:var(--ink-f)">/30</div></div></div><h1 class="display" style="font-size:28px;color:${passed?'var(--ok)':'var(--no)'};margin:0 0 4px">${passed?'¡Aprobaste!':'Sigue estudiando'}</h1><p style="font-size:14px;color:var(--ink-f);margin:0 0 24px">${pct}% — ${30-score} incorrectas</p><div class="card" style="text-align:left;margin-bottom:20px">${Object.entries(CAT).map(([k,v])=>{let s=cs[k]||{t:0,c:0};let p=s.t?Math.round((s.c/s.t)*100):0;return`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:${CC[k]};font-weight:600">${v}</span><span style="color:var(--ink-f)">${s.c}/${s.t} (${p}%)</span></div><div class="cbar"><div class="cfill" style="width:${p}%;background:${CC[k]}"></div></div></div>`}).join('')}</div><div style="display:flex;gap:10px;margin-bottom:12px"><button class="btn2" style="flex:1" onclick="state.review=true;state.cur=0;render()">Revisar Respuestas</button><button class="btn" style="flex:1" onclick="startTest()">Nuevo Examen</button></div><button onclick="state.screen='home';render()" style="background:none;border:none;color:var(--ink-f);font-size:13px;cursor:pointer;text-decoration:underline;padding:8px">Volver al Inicio</button></div>`}

function renderReview(el){let q=state.qs[state.cur];let ua=state.ans[state.cur];let ok=ua===q.x;let sign=q.s&&SVG[q.s]?`<div class="sign-box">${SVG[q.s]}</div>`:'';el.innerHTML=`<div class="fade"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><span style="font-size:13px;color:var(--ink-f)">Revisión ${state.cur+1}/30</span><button class="btn2" style="padding:6px 14px;font-size:12px" onclick="state.review=false;state.cur=0;render()">Volver a Resultados</button></div><div class="card" style="border-left:4px solid ${ok?'var(--ok)':'var(--no)'};margin-bottom:16px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span class="pill" style="background:${CC[q.cat]}">${CAT[q.cat]}</span><span style="font-size:12px;font-weight:700;color:${ok?'var(--ok)':'var(--no)'}">${ok?'✓ Correcta':'✗ Incorrecta'}</span></div>${sign}<p style="font-size:15px;font-weight:600;line-height:1.55">${esc(q.q)}</p></div>${['a','b','c','d'].map(o=>{if(!q[o])return'';let ic=q.x===o;let iu=ua===o;let cls='opt'+(ic?' ok':'')+(iu&&!ic?' no':'');let ci=ic?'✓':iu&&!ic?'✗':o.toUpperCase();return`<div class="${cls}" style="cursor:default"><span class="oc">${ci}</span><span>${esc(q[o])}</span>${ic?'<span style="margin-left:auto;font-size:14px">✓</span>':''}</div>`}).join('')}<div style="display:flex;gap:10px;margin-top:8px"><button class="btn2" style="flex:1" onclick="state.cur=Math.max(0,state.cur-1);render()" ${state.cur===0?'disabled':''}>← Anterior</button><button class="btn2" style="flex:1" onclick="state.cur=Math.min(29,state.cur+1);render()" ${state.cur===29?'disabled':''}>Siguiente →</button></div></div>`}

render();
</script>
</body>
</html>
